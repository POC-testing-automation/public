name: Sync To Enterprise GitHub

# --------------------------------------------------------------------------
# Reusable workflow. Lives in the PUBLIC orchestrator repo on Teams GitHub.
# Private repos call this via `uses:` (workflow_call) from a thin wrapper
# workflow, passing which Enterprise GitHub org/repo to sync to.
#
# Requires an org-level secret on Teams GitHub, visible to both this repo and
# every private repo that calls it:
#   ENTERPRISE_GITHUB_TOKEN  - PAT (fine-grained or classic) valid on the
#                              Enterprise GitHub host, with repo admin+contents
#                              write access to the target org.
# And an org-level variable:
#   ENTERPRISE_GITHUB_HOST   - e.g. "github.mycompany.com" (no scheme, no
#                              trailing slash).
# Both resolve automatically for the calling repo's context as long as the
# caller uses `secrets: inherit` - no need to duplicate them per repo.
# --------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      enterprise_org:
        description: "Target organization name on the Enterprise GitHub host"
        required: true
        type: string
      enterprise_repo:
        description: "Target repository name on the Enterprise GitHub host"
        required: true
        type: string
      target_branch:
        description: "Branch to push to on the Enterprise side. Defaults to the same branch name that triggered this sync."
        required: false
        type: string
        default: ""
      create_if_missing:
        description: "Create the target repo on Enterprise GitHub if it doesn't exist"
        required: false
        type: boolean
        default: true
      force_push:
        description: "Force-push if the branch has diverged on Enterprise GitHub"
        required: false
        type: boolean
        default: false
    secrets:
      ENTERPRISE_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  validate_inputs:
    name: Validate Inputs
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.resolve.outputs.target_branch }}
    steps:
      - name: Validate org/repo and resolve target branch
        id: resolve
        env:
          ENT_ORG:  ${{ inputs.enterprise_org }}
          ENT_REPO: ${{ inputs.enterprise_repo }}
          TARGET_BRANCH_IN: ${{ inputs.target_branch }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          NAME_RE='^[A-Za-z0-9._-]+$'

          if [ -z "${ENT_ORG}" ] || ! [[ "${ENT_ORG}" =~ $NAME_RE ]]; then
            echo "::error::enterprise_org is missing or contains invalid characters: '${ENT_ORG}'"
            exit 1
          fi

          if [ -z "${ENT_REPO}" ] || ! [[ "${ENT_REPO}" =~ $NAME_RE ]]; then
            echo "::error::enterprise_repo is missing or contains invalid characters: '${ENT_REPO}'"
            exit 1
          fi

          TARGET_BRANCH="${TARGET_BRANCH_IN:-$SOURCE_BRANCH}"
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"

          echo "ℹ️ Enterprise target : ${ENT_ORG}/${ENT_REPO}"
          echo "ℹ️ Source branch     : ${SOURCE_BRANCH}"
          echo "ℹ️ Target branch     : ${TARGET_BRANCH}"

  ensure_enterprise_repo:
    name: Ensure Enterprise Repo Exists
    needs: validate_inputs
    if: inputs.create_if_missing == true
    runs-on: ubuntu-latest
    steps:
      - name: Check / create target repo on Enterprise GitHub
        env:
          ENTERPRISE_GITHUB_HOST:  ${{ vars.ENTERPRISE_GITHUB_HOST }}
          ENTERPRISE_GITHUB_TOKEN: ${{ secrets.ENTERPRISE_GITHUB_TOKEN }}
          ENT_ORG:  ${{ inputs.enterprise_org }}
          ENT_REPO: ${{ inputs.enterprise_repo }}
        run: |
          set -euo pipefail

          if [ -z "${ENTERPRISE_GITHUB_HOST:-}" ]; then
            echo "::error::ENTERPRISE_GITHUB_HOST org variable is not set."
            exit 1
          fi
          if [ -z "${ENTERPRISE_GITHUB_TOKEN:-}" ]; then
            echo "::error::ENTERPRISE_GITHUB_TOKEN secret is not available. Ensure the caller uses 'secrets: inherit' and the org secret is visible to this repo."
            exit 1
          fi

          API="https://${ENTERPRISE_GITHUB_HOST}/api/v3"

          echo "ℹ️ Checking whether ${ENT_ORG}/${ENT_REPO} exists on ${ENTERPRISE_GITHUB_HOST}..."

          STATUS=$(curl -s -o /tmp/repo.json -w '%{http_code}' \
            -H "Authorization: Bearer ${ENTERPRISE_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/repos/${ENT_ORG}/${ENT_REPO}")

          if [ "$STATUS" = "200" ]; then
            echo "✓ Repo already exists."
            exit 0
          fi

          if [ "$STATUS" != "404" ]; then
            echo "::error::Unexpected response checking repo existence -> HTTP ${STATUS}"
            cat /tmp/repo.json
            exit 1
          fi

          echo "→ Repo not found. Creating ${ENT_ORG}/${ENT_REPO} (private)..."

          CREATE_STATUS=$(curl -s -o /tmp/create.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${ENTERPRISE_GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/orgs/${ENT_ORG}/repos" \
            -d "{\"name\":\"${ENT_REPO}\",\"private\":true}")

          if [ "$CREATE_STATUS" != "201" ]; then
            echo "::error::Failed to create repo -> HTTP ${CREATE_STATUS}"
            cat /tmp/create.json
            exit 1
          fi

          echo "✓ Repo created."

  push_branch:
    name: Push Branch To Enterprise GitHub
    needs: [validate_inputs, ensure_enterprise_repo]
    # Runs even if the "ensure repo" job was skipped (create_if_missing == false)
    if: always() && needs.validate_inputs.result == 'success' && (needs.ensure_enterprise_repo.result == 'success' || needs.ensure_enterprise_repo.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      ENTERPRISE_GITHUB_HOST:  ${{ vars.ENTERPRISE_GITHUB_HOST }}
      ENTERPRISE_GITHUB_TOKEN: ${{ secrets.ENTERPRISE_GITHUB_TOKEN }}
      ENT_ORG:       ${{ inputs.enterprise_org }}
      ENT_REPO:      ${{ inputs.enterprise_repo }}
      TARGET_BRANCH: ${{ needs.validate_inputs.outputs.target_branch }}
      SOURCE_BRANCH: ${{ github.ref_name }}
      FORCE_PUSH:    ${{ inputs.force_push }}
    steps:
      # Checks out the CALLING (private) repo's code - in a workflow_call,
      # actions/checkout with no `repository:` defaults to github.repository,
      # which is the caller's repo.
      - name: Checkout private repo (source)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Push branch to Enterprise GitHub
        run: |
          set -euo pipefail

          if [ -z "${ENTERPRISE_GITHUB_HOST:-}" ]; then
            echo "::error::ENTERPRISE_GITHUB_HOST org variable is not set."
            exit 1
          fi
          if [ -z "${ENTERPRISE_GITHUB_TOKEN:-}" ]; then
            echo "::error::ENTERPRISE_GITHUB_TOKEN secret is not available."
            exit 1
          fi

          ENTERPRISE_URL="https://x-access-token:${ENTERPRISE_GITHUB_TOKEN}@${ENTERPRISE_GITHUB_HOST}/${ENT_ORG}/${ENT_REPO}.git"

          echo "ℹ️ Pushing ${SOURCE_BRANCH} -> ${ENT_ORG}/${ENT_REPO}#${TARGET_BRANCH} on ${ENTERPRISE_GITHUB_HOST}"

          git remote add enterprise "${ENTERPRISE_URL}"

          FORCE_FLAG=()
          [ "${FORCE_PUSH}" = "true" ] && FORCE_FLAG=(--force)

          for i in 1 2 3; do
            echo "Attempt ${i} of 3..."
            if git push "${FORCE_FLAG[@]}" enterprise "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "✅ Push succeeded"
              exit 0
            fi
            echo "⚠️ Attempt ${i} failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Push to Enterprise GitHub failed after 3 attempts. If the branch diverged, re-run with force_push: true."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🔁 Synced to Enterprise GitHub"
            echo ""
            echo "| Source repo | Source branch | Target | Target branch |"
            echo "| --- | --- | --- | --- |"
            echo "| \`${{ github.repository }}\` | \`${SOURCE_BRANCH}\` | \`${ENT_ORG}/${ENT_REPO}\` on \`${ENTERPRISE_GITHUB_HOST}\` | \`${TARGET_BRANCH}\` |"
          } >> "$GITHUB_STEP_SUMMARY"