name: Sync Teams Repo To Enterprise

on:
  workflow_call:

    inputs:

      source_repo:
        description: "Teams source repository"
        required: true
        type: string

      enterprise_org:
        description: "Enterprise organization"
        required: true
        type: string

      enterprise_repo:
        description: "Enterprise repository"
        required: true
        type: string

      target_branch:
        description: "Enterprise target branch"
        required: true
        type: string

    secrets:

      GH_TEAMS_PAT:
        required: true

      GH_ENTERPRISE_PAT:
        required: true


jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Display configuration
      # --------------------------------------------------

      - name: Display configuration
        run: |
          echo "Source repository : ${{ inputs.source_repo }}"
          echo "Enterprise org    : ${{ inputs.enterprise_org }}"
          echo "Enterprise repo   : ${{ inputs.enterprise_repo }}"
          echo "Target branch     : ${{ inputs.target_branch }}"


      # --------------------------------------------------
      # 2. Clone Teams repository
      # --------------------------------------------------

      - name: Clone Teams repository
        env:
          GH_TEAMS_PAT: ${{ secrets.GH_TEAMS_PAT }}
        run: |

          git clone \
            "https://${GH_TEAMS_PAT}@github.com/POC-testing-automation/${{ inputs.source_repo }}.git" \
            source

          cd source

          git fetch --all --prune

          git checkout sync

          echo "Teams repository checked out:"
          git branch --show-current

          echo "Latest Teams commit:"
          git log -1 --oneline

          echo "Teams commit count:"
          git rev-list --count sync


      # --------------------------------------------------
      # 3. Clone Enterprise repository
      # --------------------------------------------------

      - name: Clone Enterprise repository
        env:
          GH_ENTERPRISE_PAT: ${{ secrets.GH_ENTERPRISE_PAT }}
        run: |

          git clone \
            "https://${GH_ENTERPRISE_PAT}@github.com/${{ inputs.enterprise_org }}/${{ inputs.enterprise_repo }}.git" \
            target

          cd target

          git fetch --all --prune

          echo "Enterprise repository cloned."


      # --------------------------------------------------
      # 4. Synchronize Teams Git history
      # --------------------------------------------------

      - name: Synchronize Git history
        run: |

          cd target

          git remote add teams ../source

          git fetch teams sync

          echo "Teams history fetched."

          echo "Teams commit count:"
          git rev-list --count teams/sync

          git config user.name "Enterprise Sync Bot"
          git config user.email "sync-bot@company.com"

          git checkout -B \
            "${{ inputs.target_branch }}" \
            teams/sync

          echo "Target branch:"
          git branch --show-current

          echo "Target latest commit:"
          git log -1 --oneline


      # --------------------------------------------------
      # 5. Push complete Teams history to Enterprise
      # --------------------------------------------------

      - name: Push to Enterprise
        working-directory: target
        run: |

          git push \
            origin \
            "${{ inputs.target_branch }}" \
            --force

          echo "=========================================="
          echo "Synchronization completed successfully"
          echo "=========================================="

          echo "Enterprise repository:"
          echo "${{ inputs.enterprise_org }}/${{ inputs.enterprise_repo }}"

          echo "Enterprise branch:"
          echo "${{ inputs.target_branch }}"


      # --------------------------------------------------
      # 6. Cleanup
      # --------------------------------------------------

      - name: Cleanup
        if: always()
        run: |

          echo "Cleaning cloned repositories..."

          rm -rf source
          rm -rf target

          echo "Cleanup completed."